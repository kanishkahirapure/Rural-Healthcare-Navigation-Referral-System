name: rural-health

# Settings shared by every service
x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - rural-net

services:

  mysql:
    <<: *service-defaults
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # Runs only on the first start, when the data volume is empty
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "3307:3306"   # 3307 on the host so it does not clash with a local MySQL on 3306
    healthcheck:
      # -h 127.0.0.1 forces a TCP check, which only succeeds after the init scripts finish
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  discovery-server:
    <<: *service-defaults
    build: ./backend/discovery-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8761/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  user-service:
    <<: *service-defaults
    build: ./backend/user-service
    environment:
      DB_URL: "jdbc:mysql://mysql:3306/user_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP: "true"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  core-service:
    <<: *service-defaults
    build: ./backend/core-service
    environment:
      DB_URL: "jdbc:mysql://mysql:3306/core_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP: "true"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  ai-service:
    <<: *service-defaults
    build: ./backend/ai-service
    environment:
      CORE_SERVICE_URL: http://core-service:8082
      # Empty key is allowed: the service then uses its keyword fallback
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
    depends_on:
      core-service:
        condition: service_healthy
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8083/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  api-gateway:
    <<: *service-defaults
    build: ./backend/api-gateway
    environment:
      USER_SERVICE_URL: http://user-service:8081
      CORE_SERVICE_URL: http://core-service:8082
      AI_SERVICE_URL: http://ai-service:8083
    depends_on:
      user-service:
        condition: service_healthy
      core-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    <<: *service-defaults
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "5173:80"

networks:
  rural-net:
    driver: bridge

volumes:
  mysql-data: