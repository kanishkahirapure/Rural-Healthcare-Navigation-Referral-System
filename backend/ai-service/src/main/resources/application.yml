server:
  port: 8083

spring:
  application:
    name: ai-service

core-service:
  base-url: ${CORE_SERVICE_URL:http://localhost:8082}
  connect-timeout-ms: 3000
  read-timeout-ms: 5000

gemini:
  api:
    key: ${GEMINI_API_KEY:}
    base-url: https://generativelanguage.googleapis.com
    model: ${GEMINI_MODEL:gemini-3.8-flash}   # use the model name that worked for you
    connect-timeout-ms: 5000
    read-timeout-ms: 20000

logging:
  level:
    com.ruralhealth: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never